<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Welcome to Student Expense Tracker</h1>
        <p>Track your money and manage your expenses easily.</p>
    </header>

    <main>
        <section>
            <h2>Current Balance</h2>
            <p id="balance">₦0.00</p>
        </section>

        <section>
            <h2>Total Income</h2>
            <p id="income">₦0.00</p>
        </section>

        <section>
            <h2>Total Expenses</h2>
            <p id="expenses">₦0.00</p>
        </section>

        <section>
            <h2>Add a Transaction</h2>

            <form id="form">
                <label for="description">Description</label>
                <input type="text" id="description" placeholder="e.g. Food or Allowance" required>

                <label for="amount">Amount (₦)</label>
                <input type="number" id="amount" min="1" step="0.01" placeholder="Enter amount" required>

                <label for="type">Transaction Type</label>
                <select id="type">
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>

                <button type="submit">Add Transaction</button>
            </form>
        </section>

        <section>
            <h2>Transaction History</h2>
            <ul id="transactions">
            </ul>
        </section>
    </main>

    <script src="scriipt.js"></script>
</body>

</html>
